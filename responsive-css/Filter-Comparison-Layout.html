<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Filter-Comparison-Layout.css">
</head>
<body>
    <header>
        <h1>Filter Comparison</h1>
    </header>
    <main>
        <section class="comparison">
            <div class="image-container">
                <img src="https://via.placeholder.com/300x200?text=Before" alt="Before">
                <p>Before Filter</p>
            </div>
            <div class="image-container">
                <img src="https://via.placeholder.com/300x200?text=After" alt="After">
                <p>After Filter (Brightness)</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Comparison</p>
    </footer>
</body>
</html>
