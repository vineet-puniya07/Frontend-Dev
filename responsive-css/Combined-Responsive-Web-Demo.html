<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Responsive Web Demo</title>
    <link rel="stylesheet" href="Combined-Responsive-Web-Demo.css">
</head>
<body>
    <header>
        <div class="logo">Logo</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="gallery">
            <img src="https://via.placeholder.com/300x200?text=Gallery+1" alt="Gallery 1">
            <img src="https://via.placeholder.com/300x200?text=Gallery+2" alt="Gallery 2">
            <img src="https://via.placeholder.com/300x200?text=Gallery+3" alt="Gallery 3">

        <section class="text-explanation">

            <p>Responsive design ensures websites look good on all devices by adapting layouts, images, and typography.</p>
        </section>
        <section class="cheat-preview">
            <div class="preview-box">

                <p>Visual effects.</p>
            </div>

    <footer>
        <p>Contact: email@example.com</p>
    </footer>
