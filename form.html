<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll Form</title>
</head>
<body>
    <form>
        <legend>Employee Payroll Form</legend>
        <label for="user">Name: </label>
        <input type="text" id = "username" name = "Name" required>
        <br><br>
        <label>Profile Image: </label>
        <input type="radio" id="img1" name="profile" value="img1">
            <label for="img1">
                <img src="https://via.placeholder.com/70" alt="Profile 1" width="70" height="70">
            </label>

            <input type="radio" id="img2" name="profile" value="img2">
            <label for="img2">
                <img src="https://via.placeholder.com/70/0000FF" alt="Profile 2" width="70" height="70">
            </label>

            <input type="radio" id="img3" name="profile" value="img3">
            <label for="img3">
                <img src="https://via.placeholder.com/70/FF0000" alt="Profile 3" width="70" height="70">
            </label>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="M"> Male
        <input type="radio" name="gender" value="F"> Female
        <br><br>
        <label>Department: </label>
        <input type="checkbox" name="department"> HR
        <input type="checkbox" name="department"> Sales
        <input type="checkbox" name="department"> Finance
        <input type="checkbox" name="department"> Engineer
        <input type="checkbox" name="department"> Others
        <br><br>
        <label>Salary: </label>
        <select name="dropdown" id="">Select Salary
            <option value="">--Select Salary--</option>
                <option value="10000">₹10,000</option>
                <option value="20000">₹20,000</option>
                <option value="30000">₹30,000</option>
                <option value="40000">₹40,000</option>
                <option value="50000">₹50,000</option>
        </select>
        <br><br>
        <label>Start Date: </label>
        <input type="date" name="" id="">
        <br><br>
        <label>Notes: </label>
        <textarea name="notes" id=""></textarea>
        <br><br>
        <button>Cancel</button>
        <button>Submit</button>
        <button>Reset</button>
    </form>
    
</body>
</html>
